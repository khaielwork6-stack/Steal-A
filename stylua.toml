# StyLua settings matching the existing code (tabs, double quotes, LF).
# Not enforced in CI and not applied to the whole codebase: format only the
# files you are already changing, e.g. `stylua src/server/PartKit.luau`.
column_width = 120
line_endings = "Unix"
indent_type = "Tabs"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
